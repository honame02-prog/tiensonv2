<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#14161c" />
  <title>Tiên Sơn – world test</title>
  <style>
    @font-face { font-family: 'NotoSerifVN'; font-weight: 500; src: url('./fonts/NotoSerifVN-500.woff') format('woff'); font-display: block; }
    @font-face { font-family: 'NotoSerifVN'; font-weight: 700; src: url('./fonts/NotoSerifVN-700.woff') format('woff'); font-display: block; }
    html, body { margin: 0; height: 100%; background: #8ea2b6; overflow: hidden; position: fixed; inset: 0;
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #game { width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
    canvas { touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }
    #preload-font { font-family: 'NotoSerifVN'; position: absolute; left: -9999px; }
    #ui .title, #ui .help { display: none !important; }
  </style>
</head>
<body>
  <div id="preload-font">Chào lãng khách ệ ữ ợ <b>Trà Sư</b></div>
  <div id="game"></div>
  <script type="module" src="/src/worldtest.js"></script>
</body>
</html>
